# autoTagReview rules. Copied to rules.yaml on first load; edit rules.yaml.
# Tag keys are tag names (case-insensitive). See DESIGN.md for the full schema.

settings:
  autoThreshold: 0.8          # smoothed precision needed to auto-check a chip
  minHits: 10                 # ...measured over at least this many scenes
  dropParentWhenChild: true   # propose the child tag only
  preferLongest: true         # "Black Leather" beats "Leather" on the same words
  maskPerformerFirstNames: true
  autoMultiWordUnscored: true # multi-word phrases with no score yet are auto

# Phrases removed from text before matching (like a studio name would be).
stoplist:
  - welcome home

# Extra path tokens to ignore (resolutions, codecs, extensions are built in).
pathJunk: []

tags: {}
